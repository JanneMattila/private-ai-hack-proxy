[project]
name = "identity-proxy"
version = "0.1.0"
description = "Anonymous A2A proxy with outbound Microsoft Entra authentication"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25,<2",
    "aiohttp>=3.13,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]